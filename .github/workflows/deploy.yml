name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'public/images/projects/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify API foundation
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_GITHUB_OWNER: ${{ github.repository_owner }}
          VITE_GITHUB_REPO: ${{ github.event.repository.name }}
          VITE_GITHUB_BRANCH: main
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Set up Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Deploy uploaded artifact to Pages
        id: deployment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        with:
          retries: 3
          script: |
            // Use the upload's exact ID. The artifact service lookup in deploy-pages
            // intermittently returned no results even when the REST API had the file.
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('The upload did not return a valid artifact ID.');
            }
            let ready = false;
            for (let attempt = 0; attempt < 12; attempt++) {
              try {
                const { data: artifact } = await github.rest.actions.getArtifact({
                  ...context.repo, artifact_id: artifactId
                });
                if (artifact.expired || artifact.workflow_run?.id !== context.runId) {
                  throw new Error('The artifact is expired or belongs to another workflow run.');
                }
                ready = true;
                break;
              } catch (error) {
                if (error.status !== 404) throw error;
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
            }
            if (!ready) throw new Error('The uploaded artifact is not available.');
            const oidcToken = await core.getIDToken();
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: oidcToken
            });
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop();
            if (!deploymentId) throw new Error('Pages did not return a deployment ID.');
            let succeeded = false;
            try {
              for (let attempt = 0; attempt < 72; attempt++) {
                const { data: status } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                  ...context.repo, deploymentId
                });
                core.info('Pages deployment status: ' + status.status);
                if (status.status === 'succeed') {
                  succeeded = true;
                  core.setOutput('page_url', deployment.page_url || `https://${context.repo.owner.toLowerCase()}.github.io/${context.repo.repo}/`);
                  break;
                }
                if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(status.status)) {
                  throw new Error('Pages deployment failed: ' + status.status);
                }
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
              if (!succeeded) throw new Error('Timed out waiting for Pages deployment.');
            } finally {
              if (!succeeded) {
                await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', {
                  ...context.repo, deploymentId
                }).catch(error => core.warning('Could not cancel Pages deployment: ' + error.message));
              }
            }
