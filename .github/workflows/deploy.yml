name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'public/images/projects/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify API foundation
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_GITHUB_OWNER: ${{ github.repository_owner }}
          VITE_GITHUB_REPO: ${{ github.event.repository.name }}
          VITE_GITHUB_BRANCH: main
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Set up Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts"
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'pages-artifact-readiness',
          })
          for attempt in range(12):
              with urllib.request.urlopen(request, timeout=20) as response:
                  artifacts = json.load(response)['artifacts']
              if any(item['name'] == 'github-pages' and not item['expired'] for item in artifacts):
                  print('Pages artifact metadata is available.')
                  break
              print(f'Waiting for Pages artifact metadata ({attempt + 1}/12)...')
              time.sleep(5)
          else:
              raise SystemExit('Pages artifact was uploaded but its metadata is not available.')
          PY
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
